name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run contract, backend, frontend and launch tests
        env:
          CHANGE_DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check CHECK_IMAGE=vorrio:ci

      - name: Scan the built image
        run: make image-scan CHECK_IMAGE=vorrio:ci

      - name: Generate CycloneDX SBOM
        run: make sbom CHECK_IMAGE=vorrio:ci SBOM_FILE=vorrio-sbom.cdx.json

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vorrio-sbom.cdx.json
          path: vorrio-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
