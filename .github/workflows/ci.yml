name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run contract, backend, frontend and launch tests
        env:
          CHANGE_DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check CHECK_IMAGE=vorrio:ci

      - name: Scan the built image
        run: make image-scan CHECK_IMAGE=vorrio:ci

      - name: Generate CycloneDX SBOM
        run: make sbom CHECK_IMAGE=vorrio:ci SBOM_FILE=vorrio-sbom.cdx.json

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vorrio-sbom.cdx.json
          path: vorrio-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
