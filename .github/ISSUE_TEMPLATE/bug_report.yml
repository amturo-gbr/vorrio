name: Bug report
description: Report a reproducible Vorrio problem with synthetic data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Please remove receipt contents, addresses, credentials and household data before submitting.
        Security vulnerabilities belong in a private security advisory, not a public issue.
  - type: input
    id: version
    attributes:
      label: Vorrio version or image digest
      placeholder: 0.8.17 or sha256:...
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment profile
      options:
        - LAN only
        - Private HTTPS or VPN
        - Public HTTPS
        - Development checkout
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant logs only after removing secrets, addresses, receipt text and personal paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, cookies, receipt data, addresses and other private household information.
          required: true
