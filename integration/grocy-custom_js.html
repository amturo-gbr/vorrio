<!-- Vorrio launcher. Safe to include once in data/custom_js.html. -->
<script>
(() => {
  const appUrl = (window.VORRIO_URL || `${window.location.protocol}//${window.location.hostname}:9380/`);
  const buttonId = "grocy-receipt-ai-launcher";

  const install = () => {
    if (document.getElementById(buttonId) || window.location.pathname.includes("/login")) return;

    const launcher = document.createElement("a");
    launcher.id = buttonId;
    launcher.href = appUrl;
    launcher.setAttribute("aria-label", "Bon mit Vorrio scannen");
    launcher.innerHTML = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z" />
        <path d="M9 8h6M9 12h4" />
      </svg>
      <span>Bon scannen</span>
    `;

    const style = document.createElement("style");
    style.textContent = `
      #${buttonId} {
        position: fixed;
        right: 1rem;
        bottom: max(1rem, env(safe-area-inset-bottom));
        z-index: 1040;
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        gap: .55rem;
        padding: 0 1rem;
        color: #fff;
        border-radius: .8rem;
        background: #176b35;
        box-shadow: 0 .5rem 1.4rem rgba(0, 0, 0, .22);
        font-size: .92rem;
        font-weight: 700;
        text-decoration: none;
      }
      #${buttonId}:hover, #${buttonId}:focus { color: #fff; background: #10592b; text-decoration: none; }
      #${buttonId} svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      @media (max-width: 575px) {
        #${buttonId} { bottom: calc(4.4rem + env(safe-area-inset-bottom)); }
      }
    `;
    document.head.appendChild(style);
    document.body.appendChild(launcher);
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", install, { once: true });
  else install();
})();
</script>
