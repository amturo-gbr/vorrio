<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Vorrio Social Card</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        display: grid;
        grid-template-columns: 52% 48%;
        color: #182128;
        background: linear-gradient(135deg, #ffffff 0%, #f7faf7 58%, #e7f1e8 100%);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .copy { position: relative; z-index: 2; padding: 62px 38px 52px 68px; }
      .brand { display: flex; align-items: center; gap: 16px; color: #176b35; font-size: 34px; font-weight: 850; letter-spacing: -.04em; }
      .brand img { width: 56px; height: 56px; object-fit: contain; }
      .eyebrow { margin: 70px 0 18px; color: #176b35; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { max-width: 540px; margin: 0; font-size: 58px; line-height: 1.02; letter-spacing: -.052em; }
      .subline { max-width: 500px; margin: 26px 0 0; color: #596168; font-size: 23px; line-height: 1.42; }
      .domain { position: absolute; left: 68px; bottom: 42px; color: #176b35; font-size: 20px; font-weight: 800; }
      .visual { position: relative; display: grid; align-items: center; padding: 52px 0 52px 8px; }
      .desktop {
        width: 650px;
        height: 470px;
        object-fit: cover;
        object-position: top left;
        border: 10px solid #182128;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 30px 70px rgba(24, 33, 40, .18);
      }
      .phone {
        position: absolute;
        right: 42px;
        bottom: 38px;
        width: 158px;
        height: 342px;
        object-fit: cover;
        object-position: top;
        border: 8px solid #182128;
        border-radius: 30px;
        background: #fff;
        box-shadow: 0 24px 46px rgba(24, 33, 40, .24);
      }
      .accent { position: absolute; inset: auto 0 0 auto; width: 310px; height: 310px; border-radius: 50% 0 0; background: rgba(23, 107, 53, .08); }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="brand"><img src="assets/brand/vorrio-mark.png" alt="" /><span>Vorrio</span></div>
      <p class="eyebrow" data-eyebrow>Open Source · Self-hosted</p>
      <h1 data-title>Dein Einkauf wird zum verlässlichen Vorrat.</h1>
      <p class="subline" data-subline>Bons, Produktscans und Bestand – unter deiner Kontrolle.</p>
      <span class="domain">vorrio.app</span>
    </section>
    <section class="visual" aria-hidden="true">
      <span class="accent"></span>
      <img class="desktop" data-desktop src="assets/scanner-desktop.png" alt="" />
      <img class="phone" data-phone src="assets/receipt-review-mobile.jpg" alt="" />
    </section>
    <script>
      if (new URLSearchParams(location.search).get('lang') === 'en') {
        document.documentElement.lang = 'en'
        document.querySelector('[data-title]').textContent = 'Turn every purchase into reliable household stock.'
        document.querySelector('[data-subline]').textContent = 'Receipts, product scans and inventory – under your control.'
        document.querySelector('[data-desktop]').src = 'assets/scanner-desktop-en.png'
        document.querySelector('[data-phone]').src = 'assets/receipt-review-mobile-en.png'
      }
    </script>
  </body>
</html>
