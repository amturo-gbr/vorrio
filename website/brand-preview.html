<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vorrio – finales Logo</title>
    <style>
      :root { color: #182128; background: #f3f5f1; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; }
      main { min-height: 900px; padding: 54px 64px 64px; }
      header { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 30px; border-bottom: 1px solid #d9ded8; }
      .eyebrow { margin: 0 0 10px; color: #176b35; font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 52px; line-height: 1; letter-spacing: -.045em; }
      .status { margin: 0; padding: 9px 14px; color: #176b35; background: #e4efe5; border-radius: 999px; font-size: 14px; font-weight: 800; }
      .board { display: grid; grid-template-columns: minmax(0, 1.14fr) minmax(430px, .86fr); gap: 28px; margin-top: 28px; }
      .panel { border: 1px solid #d9ded8; border-radius: 28px; background: #fff; overflow: hidden; }
      .hero { min-height: 650px; display: grid; place-items: center; padding: 64px; }
      .hero-mark { width: min(420px, 76%); aspect-ratio: 1; object-fit: contain; }
      .side { display: grid; grid-template-rows: 1fr 1fr; gap: 28px; }
      .lockup { display: grid; align-content: center; gap: 34px; padding: 48px; }
      .lockup-row { display: flex; align-items: center; gap: 22px; }
      .lockup-row img { width: 86px; height: 86px; object-fit: contain; }
      .word { font-size: 68px; font-weight: 850; letter-spacing: -.055em; }
      .sizes { display: flex; align-items: center; gap: 26px; padding-top: 28px; border-top: 1px solid #e5e8e4; }
      .sizes img { object-fit: contain; }
      .icon-panel { display: grid; grid-template-columns: 190px 1fr; align-items: center; gap: 34px; padding: 38px 44px; color: #fff; background: #176b35; }
      .app-icon { width: 190px; height: 190px; border-radius: 42px; box-shadow: 0 16px 36px rgba(6, 51, 24, .26); }
      h2 { margin: 0 0 10px; font-size: 28px; letter-spacing: -.035em; }
      p { margin: 0; color: #6d7277; font-size: 17px; line-height: 1.5; }
      .icon-panel p { color: rgba(255, 255, 255, .78); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Vorrio Identität</p>
          <h1>Finales Markenzeichen</h1>
        </div>
        <p class="status">Richtung 01 · final</p>
      </header>
      <section class="board" aria-label="Vorrio Logoanwendungen">
        <div class="panel hero">
          <img class="hero-mark" src="assets/brand/vorrio-mark.png" alt="Vorrio Markenzeichen" />
        </div>
        <div class="side">
          <div class="panel lockup">
            <div class="lockup-row">
              <img src="assets/brand/vorrio-mark.png" alt="" />
              <span class="word">Vorrio</span>
            </div>
            <div class="sizes" aria-label="Kleine Logogrößen">
              <img src="assets/brand/vorrio-mark.png" alt="" width="48" height="48" />
              <img src="assets/brand/vorrio-mark.png" alt="" width="32" height="32" />
              <img src="assets/brand/vorrio-mark.png" alt="" width="24" height="24" />
              <p>48 · 32 · 24 px</p>
            </div>
          </div>
          <div class="panel icon-panel">
            <img class="app-icon" src="assets/vorrio-icon.png" alt="Vorrio App-Icon" />
            <div>
              <h2>App-Icon</h2>
              <p>Das negative V bleibt auch in kleinen Größen klar und eigenständig.</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
